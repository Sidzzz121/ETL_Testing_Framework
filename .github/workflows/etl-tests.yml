
name: ETL Testing Framework CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: etl_testing_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d etl_testing_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Configure database environment
        run: |
          echo "ETL_DB_HOST=localhost" >> $GITHUB_ENV
          echo "ETL_DB_PORT=5432" >> $GITHUB_ENV
          echo "ETL_DB_USER=postgres" >> $GITHUB_ENV
          echo "ETL_DB_PASSWORD=postgres" >> $GITHUB_ENV
          echo "ETL_DB_NAME=etl_testing_db" >> $GITHUB_ENV

      - name: Create database tables
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d etl_testing_db -c "
          CREATE TABLE source_customers (
            customer_id INT PRIMARY KEY,
            customer_name VARCHAR(100),
            email VARCHAR(150),
            city VARCHAR(100),
            amount NUMERIC(10,2)
          );
          CREATE TABLE target_customers (
            customer_id INT PRIMARY KEY,
            customer_name VARCHAR(100),
            email VARCHAR(150),
            city VARCHAR(100),
            amount NUMERIC(10,2),
            customer_segment VARCHAR(20)
          );
          INSERT INTO source_customers VALUES
            (1, 'Rahul Sharma', 'rahul@gmail.com', 'Mumbai', 15000),
            (2, 'Priya Patel', 'priya@gmail.com', 'Pune', 22000),
            (3, 'Amit Kumar', 'amit@gmail.com', 'Delhi', 18000),
            (4, 'Sneha Joshi', 'sneha@gmail.com', 'Bangalore', 25000),
            (5, 'Vikas Singh', 'vikas@gmail.com', 'Mumbai', 12000);
          "

      - name: Run ETL and automated tests
        run: python run_framework.py
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl-test-and-coverage-reports
          path: |
            reports/etl_report.html
            reports/coverage/
          if-no-files-found: warn

        
        
